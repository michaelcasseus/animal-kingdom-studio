<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121418">
    <meta name="description" content="Compose, shape, and export music from the sounds of four animal kingdoms.">
    <title>Animal Kingdom Studio</title>

  <body>
    <div id="app" aria-label="Animal Kingdom Studio"></div>
    <footer class="playlist-banner" aria-labelledby="playlist-title">

        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </footer>
    <script type="module" src="./app.js?v=8b0befc99dff"></script>
